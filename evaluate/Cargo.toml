[package]
name = "datalog"
description = "Datalog evaluated against relations a host holds, on datafrog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# What a program is, read and checked; re-exported, so a host takes this crate
# alone. datafrog evaluates: semi-naive iteration to a fixed point, somebody
# else's and tested, with no dependencies of its own. Its rules are Rust over
# tuple types fixed when it is compiled, so src/lib.rs is the compiler from a
# program read at run time to its joins.
[dependencies]
datalog-syntax = { path = "../syntax" }
datafrog = "2.0.1"
